<style>

  .barwrap > div { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .barlabel { font-size:8px; color:#475569; }
  select.small, input.small { font-size:12px; padding:6px 8px; border-radius:8px; }
  .legend { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; }

</style>

<body>

<header id="hdr" class="row" style="position:sticky;top:0;z-index:9;background:rgba(2,6,23,.92);backdrop-filter:blur(6px);border-bottom:1px solid #1e293b;padding:10px 16px;justify-content:space-between;">

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const monthStr = (d) => d.slice(0, 7);
const monthLabel = (m) => new Date(m + "-01").toLocaleString("en-IN", { month: "long", year: "numeric" });

function parseCSV(text) {
  const rows = []; let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; } else field += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === ",") { cur.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; cur.push(field); field = ""; if (cur.length > 1 || cur[0].trim() !== "") rows.push(cur); cur = []; }
    else field += ch;
  }
  cur.push(field); if (cur.length > 1 || cur[0].trim() !== "") rows.push(cur);
  return rows;
}
function parseText(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim());
  const withCommas = lines.filter((l) => l.includes(",")).length;
  if (withCommas >= lines.length / 2) return parseCSV(text);
  return lines.map((l) => l.split(/\s{2,}/).map((f) => f.trim()).filter((f) => f !== ""));
}
function parseDateStr(s) {
  s = String(s || "").trim().split(/[ T]/)[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) { let d = m[1], mo = m[2], y = m[3]; if (y.length === 2) y = "20" + y; if (+mo > 12) { const t = d; d = mo; mo = t; } return y + "-" + mo.padStart(2, "0") + "-" + d.padStart(2, "0"); }
  return null;
}
const cleanNum = (s) => { const v = parseFloat(String(s || "").replace(/[₹,\s]/g, "")); return isNaN(v) ? null : v; };

/* ---------- defaults & seed ---------- */
const DEFAULT_CATEGORIES = [
  { id: "groceries", name: "Groceries", color: "#22c55e", icon: "🛒" },
  { id: "food", name: "Food & Dining", color: "#f97316", icon: "🍽️" },
  { id: "transport", name: "Transport & Fuel", color: "#3b82f6", icon: "🚗" },
  { id: "bills", name: "Bills & Utilities", color: "#eab308", icon: "💡" },
  { id: "rent", name: "Rent", color: "#a855f7", icon: "🏠" },
  { id: "shopping", name: "Shopping", color: "#ec4899", icon: "🛍️" },
  { id: "health", name: "Health", color: "#ef4444", icon: "💊" },
  { id: "entertainment", name: "Entertainment", color: "#14b8a6", icon: "🎬" },
  { id: "subs", name: "Subscriptions", color: "#6366f1", icon: "📺" },
  { id: "education", name: "Education", color: "#0ea5e9", icon: "📚" },
  { id: "travel", name: "Travel", color: "#f43f5e", icon: "✈️" },
  { id: "invest", name: "Investments / SIP", color: "#84cc16", icon: "📈" },
  { id: "other", name: "Other", color: "#94a3b8", icon: "📦" },
  { id: "salary", name: "Salary", color: "#10b981", icon: "💰", income: true },
  { id: "interest", name: "Interest / Cashback", color: "#34d399", icon: "🏦", income: true },
];
const DEFAULT_ACCOUNTS = [
  { id: "gpay", name: "GPay (HDFC)" },
  { id: "card-hdfc", name: "HDFC Credit Card" },
  { id: "card-amex", name: "Amex Credit Card" },
  { id: "bank", name: "SBI Bank" },
];
const PALETTE = ["#22c55e","#f97316","#3b82f6","#eab308","#a855f7","#ec4899","#ef4444","#14b8a6","#6366f1","#0ea5e9","#f43f5e","#84cc16","#94a3b8"];
const ICONS = ["🛒","🍽️","🚗","💡","🏠","🛍️","💊","🎬","📺","📚","✈️","📈","📦","💰","🏦","🎓","🐾","🎁","⚽","☕"];

function makeSeed(cats, accs) {
  const c = (id) => { const x = cats.find((y) => y.id === id) || {}; return { categoryId: id, catName: x.name || id, catIcon: x.icon || "📦", catColor: x.color || "#94a3b8" }; };
  const a = (id) => { const x = accs.find((y) => y.id === id) || {}; return { accountId: id, accName: x.name || id }; };
  const ym = todayStr().slice(0, 7);
  const mk = (day, amount, cat, acc, payee) => ({ id: uid(), date: ym + "-" + String(day).padStart(2, "0"), amount, type: "expense", payee, note: "", source: "sample", ...c(cat), ...a(acc) });
  return [
    { id: uid(), date: ym + "-01", amount: 85000, type: "income", payee: "Employer", note: "", source: "sample", ...c("salary"), ...a("bank") },
    { id: uid(), date: ym + "-02", amount: 18000, type: "expense", payee: "Landlord", note: "", source: "sample", ...c("rent"), ...a("gpay") },
    mk(3, 2480, "groceries", "gpay", "BigBasket"), mk(4, 350, "food", "gpay", "Swiggy"), mk(5, 2000, "transport", "gpay", "IndianOil"),
    { id: uid(), date: ym + "-06", amount: 12500, type: "expense", payee: "Zerodha SIP", note: "", source: "sample", ...c("invest"), ...a("bank") },
    mk(7, 799, "subs", "card-hdfc", "Netflix"), mk(8, 1180, "shopping", "card-hdfc", "Amazon"), mk(9, 640, "food", "gpay", "Zomato"),
    mk(10, 1560, "bills", "gpay", "Electricity Bill"), mk(11, 890, "entertainment", "card-hdfc", "BookMyShow"), mk(12, 3100, "groceries", "gpay", "DMart"),
    mk(13, 420, "transport", "gpay", "Uber"), mk(14, 2450, "shopping", "card-amex", "Myntra"), mk(15, 560, "food", "gpay", "Chai Point"),
    { id: uid(), date: ym + "-16", amount: 1200, type: "income", payee: "Refund + cashback", note: "", source: "sample", ...c("interest"), ...a("bank") },
    mk(17, 1350, "health", "gpay", "PharmEasy"), mk(18, 7200, "travel", "card-hdfc", "IRCTC"),
  ];
}

/* ---------- state ---------- */
let txns = [], cats = [], accs = [];
let view = "dashboard", month = monthStr(todayStr());
let editingId = null, menu = null, menuGuard = 0, pressTimer = null;
let pendingDelete = null, confirmBox = null, editorBox = null, showTrashFlag = false;
let imp = null; // {step, rows, name, hasHeader, map:{date,payee,amount,sign,debit,credit,category}, msg}
let pinHash = null, locked = false;
let selMode = false, selSet = new Set();
let panelBox = null;
function openPanel(html) { panelBox = html; renderOverlays(); }
function closePanel() { panelBox = null; renderOverlays(); }

function save() {
  try { localStorage.setItem("fty", JSON.stringify({ txns, cats, accs, pinHash })); } catch (e) {}
  scheduleSync();
}
function loadAll() {
  try {
    const d = JSON.parse(localStorage.getItem("fty") || "null");
    if (d && d.cats && d.cats.length) { txns = d.txns || []; cats = d.cats; accs = d.accs || DEFAULT_ACCOUNTS; pinHash = d.pinHash || null; return; }
  } catch (e) {}
  cats = DEFAULT_CATEGORIES.slice(); accs = DEFAULT_ACCOUNTS.slice(); txns = []; save();
}
loadAll();
// purge trash older than 7 days
(function purge() {
  const cutoff = Date.now() - 7 * 86400000;
  const keep = txns.filter((t) => !t.deletedAt || new Date(t.deletedAt).getTime() > cutoff);
  if (keep.length !== txns.length) { txns = keep; save(); }
})();

const catById = () => Object.fromEntries(cats.map((c) => [c.id, c]));
const accById = () => Object.fromEntries(accs.map((a) => [a.id, a]));
const catSnap = (id) => { const c = catById()[id] || {}; return { categoryId: id, catName: c.name || id, catIcon: c.icon || "📦", catColor: c.color || "#94a3b8" }; };
const accSnap = (id) => { const a = accById()[id] || {}; return { accountId: id, accName: a.name || id }; };
const usageCount = (kind, id) => txns.filter((t) => (kind === "cat" ? t.categoryId === id : t.accountId === id)).length;
const trash = () => txns.filter((t) => t.deletedAt).sort((a, b) => (b.deletedAt || "").localeCompare(a.deletedAt || ""));
const daysLeft = (t) => Math.max(0, Math.ceil(7 - (Date.now() - new Date(t.deletedAt).getTime()) / 86400000));

/* ---------- lock ---------- */
async function sha(s) { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join(""); }
function tryLock() {
  if (pinHash) { locked = true; render(); }
  else { openPanel('<h3 style="margin-top:0">Set a PIN</h3><input id="pinNew" type="password" inputmode="numeric" maxlength="6" placeholder="Choose a PIN (4-6 digits)" /><div style="height:8px"></div><button class="btn primary" style="width:100%" onclick="savePin()">Save PIN</button><button class="btn" style="width:100%;margin-top:8px" onclick="closePanel()">Not now</button><p class="muted">Your data is protected by this PIN on this device. Do not lose it: a forgotten PIN cannot be recovered (use backup &amp; restore).</p>'); }
}
async function savePin() {
  const v = $("pinNew").value; if (v.length < 4) { alert("PIN must be at least 4 digits."); return; }
  pinHash = await sha(v); save(); closePanel(); render();
}
async function unlock() {
  const v = $("pinEntry").value;
  if (await sha(v) === pinHash) { locked = false; render(); }
  else { $("pinErr").textContent = "Wrong PIN. Try again."; $("pinEntry").value = ""; }
}

/* ---------- form ---------- */
let form = { date: todayStr(), amount: "", type: "expense", category: "food", account: "gpay", payee: "", note: "" };
function openAdd(id) {
  editingId = id || null;
  if (id) {
    const t = txns.find((x) => x.id === id);
    form = { date: t.date, amount: String(t.amount), type: t.type, category: t.categoryId, account: t.accountId, payee: t.payee || "", note: t.note || "" };
  } else {
    form = { date: todayStr(), amount: "", type: "expense", category: "food", account: accs[0] ? accs[0].id : "gpay", payee: "", note: "" };
  }
  renderAddSheet();
}
function saveTxn() {
  const f = {
    date: $("fDate").value, amount: parseFloat($("fAmount").value), type: form.type,
    category: form.category, account: $("fAccount").value, payee: $("fPayee").value.trim(), note: $("fNote").value.trim(),
  };
  if (!f.amount || f.amount <= 0) { $("fErr").textContent = "Enter an amount."; return; }
  if (!catById()[f.category] || !accById()[f.account]) { $("fErr").textContent = "That category/account no longer exists — pick another."; return; }
  if (editingId) {
    txns = txns.map((t) => (t.id === editingId ? { ...t, ...f, ...catSnap(f.category), ...accSnap(f.account), removed: false } : t));
  } else {
    txns.push({ id: uid(), source: "manual", ...f, ...catSnap(f.category), ...accSnap(f.account) });
  }
  save(); closePanel(); render();
}

/* ---------- delete / trash ---------- */
function askDelete(id) { pendingDelete = txns.find((t) => t.id === id); closeMenu(); renderOverlays(); }
function moveToTrash() {
  txns = txns.map((t) => (t.id === pendingDelete.id ? { ...t, deletedAt: new Date().toISOString() } : t));
  save(); pendingDelete = null; closeMenu(); render();
}
function restoreTxn(id) { txns = txns.map((t) => (t.id === id ? (({ deletedAt, ...r }) => r)(t) : t)); save(); render(); }
function permDelete(id) { txns = txns.filter((t) => t.id !== id); save(); render(); }

/* ---------- context menu ---------- */
function openMenu(id, x, y) {
  if (Date.now() < menuGuard) return;
  menuGuard = Date.now() + 500;
  const t = txns.find((z) => z.id === id); if (!t) return;
  const s = window.getSelection && getSelection(); if (s && s.rangeCount > 0) s.removeAllRanges();
  menu = { id, x: Math.min(x, innerWidth - 150), y: Math.min(y, innerHeight - 140) };
  document.addEventListener("selectionchange", clearSel);
  renderOverlays();
}
function clearSel() { const s = window.getSelection && getSelection(); if (s && s.rangeCount > 0) s.removeAllRanges(); }
function closeMenu() { if (menu) { menu = null; document.removeEventListener("selectionchange", clearSel); renderOverlays(); } }
function touchStart(e, id) {
  const t0 = e.touches[0];
  pressTimer = setTimeout(() => openMenu(id, t0.clientX, t0.clientY), 450);
}
function touchEnd() { if (pressTimer) { clearTimeout(pressTimer); } }

/* ---------- categories / accounts manage ---------- */
function openCatEditor(kind, mode, id) {
  editorBox = { kind, mode, id };
  if (mode === "add") editorBox.draft = kind === "cat" ? { name: "", icon: "📦", color: PALETTE[0] } : { name: "" };
  else { const it = (kind === "cat" ? cats : accs).find((x) => x.id === id); editorBox.draft = { name: it.name, icon: it.icon, color: it.color }; }
  renderOverlays();
}
function stepCatEditor() {
  const eb = editorBox;
  if (!eb.draft.name || !eb.draft.name.trim()) { alert("Enter a name."); return; }
  if (eb.mode === "add") {
    if (eb.kind === "cat") cats.push({ id: uid(), ...eb.draft });
    else accs.push({ id: uid(), name: eb.draft.name });
    save(); editorBox = null; render(); return;
  }
  const it = (eb.kind === "cat" ? cats : accs).find((x) => x.id === eb.id);
  const n = usageCount(eb.kind, eb.id);
  const label = eb.kind === "cat" ? "category" : "account";
  let title = "Edit " + label, body, cta, danger = false;
  if (n === 0) { body = `"${it.name}" is not used by any transaction. It will simply be updated.`; cta = "Save"; }
  else {
    body = `You are editing the ${label} "${it.name}". This will also update ${n} past transaction${n === 1 ? "" : "s"} that use it: their displayed ${label} name${n === 1 ? "" : "s"}${eb.kind === "cat" ? ", icon and colour" : ""} will change everywhere (amounts and dates are untouched). If you only want some past entries changed, do not confirm — instead edit those transactions individually.`;
    cta = `Save and update ${n} transaction${n === 1 ? "" : "s"}`;
  }
  editorBox = null;
  confirmBox = { title, body, cta, danger, action: () => {
    if (eb.kind === "cat") { cats = cats.map((c) => (c.id === eb.id ? { ...c, ...eb.draft } : c)); txns = txns.map((t) => (t.categoryId === eb.id ? { ...t, catName: eb.draft.name, catIcon: eb.draft.icon, catColor: eb.draft.color } : t)); }
    else { accs = accs.map((a) => (a.id === eb.id ? { ...a, name: eb.draft.name } : a)); txns = txns.map((t) => (t.accountId === eb.id ? { ...t, accName: eb.draft.name } : t)); }
    save(); render();
  } };
  renderOverlays();
}
function askDeleteCA(kind, id) {
  const it = (kind === "cat" ? cats : accs).find((x) => x.id === id);
  const n = usageCount(kind, id);
  const label = kind === "cat" ? "category" : "account";
  let body = `You are deleting the ${label} "${it.name}". Past transactions will NOT be affected: the ${n} entr${n === 1 ? "y" : "ies"} recorded under it keep their saved name, icon and colour, and your totals stay exactly the same (they will be marked "removed" in lists). You also won't be able to pick it for future entries. Amounts are never deleted by removing a ${label}.`;
  confirmBox = { title: "Delete " + label, body, cta: `Delete "${it.name}"`, danger: true,
    action: () => { if (kind === "cat") cats = cats.filter((c) => c.id !== id); else accs = accs.filter((a) => a.id !== id); save(); render(); } };
  renderOverlays();
}

/* ---------- import ---------- */
const DEMO_STATEMENT = () => { const ym = todayStr().slice(0, 7); return `Date,Particulars,Withdrawal,Deposit\n${ym}-19,SWIGGY BANGALORE,640.00,\n${ym}-20,BLUE TOKAI COFFEE,480.00,\n${ym}-20,SALARY CREDIT,,85000.00\n${ym}-21,JIO RECHARGE,349.00,`; };
function importPick() { $("filePick").click(); }
$("filePick").onchange = (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") return importPdf(f);
  const r = new FileReader();
  r.onload = (ev) => startMap(String(ev.target.result || ""), f.name);
  r.readAsText(f);
};
function importPdf(f) {
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const bytes = new Uint8Array(ev.target.result);
      let raw = ""; for (let i = 0; i < bytes.length; i++) raw += String.fromCharCode(bytes[i]);
      if (raw.includes("FlateDecode")) { imp = imp || {}; imp.step = "idle"; alert("This PDF stores its text compressed, which this version can't decode yet.\n\nWorkaround: open the PDF, select the transaction table (including the header row), copy, and paste it into the paste box in the Import tab."); render(); return; }
      const texts = [...raw.matchAll(/\(((?:\\.|[^\\()])*)\)\s*T[jJ]/g)].map((m) => m[1].replace(/\\([()\\])/g, "$1"));
      const text = texts.join("\n");
      if (text.trim().length > 10) startMap(text, f.name);
      else { alert("Could not extract text from this PDF. Select its transaction table, copy, and paste into the Import tab's paste box."); }
    } catch (err) { alert("Could not read this PDF. Select its transaction table, copy, and paste into the Import tab's paste box."); }
  };
  r.readAsArrayBuffer(f);
}
function importPaste() {
  const t = $("pasteBox").value;
  if (!t.trim()) { alert("Paste your statement rows first."); return; }
  startMap(t, "pasted statement");
}
function startMap(text, name) {
  const rows = parseText(text);
  if (!rows.length) { alert("Could not read this as CSV or table text."); return; }
  imp = { step: "map", rows, name, hasHeader: true, map: {}, msg: "" };
  view = "import"; render(); guessMap();
}
function guessMap() {
  if (!imp || !imp.rows.length) return;
  const heads = (imp.hasHeader ? imp.rows[0] : []).map((h) => String(h || "").toLowerCase());
  const find = (...words) => heads.findIndex((h) => words.some((w) => h.includes(w)));
  const m = { date: find("date"), payee: find("particular", "narration", "description", "payee", "merchant", "details", "remark"), debit: find("withdraw", "debit", "paid out"), credit: find("deposit", "credit", "paid in"), amount: find("amount", "value"), sign: -1, category: -1 };
  if (m.amount < 0 && m.debit < 0 && m.credit < 0) m.amount = 1;
  if (m.payee < 0) m.payee = 2;
  imp.map = m; render();
}
function doImport() {
  const body = imp.rows.slice(imp.hasHeader ? 1 : 0);
  const batchId = uid();
  const created = []; let skipped = 0;
  const others = txns.filter((t) => !t.deletedAt);
  body.forEach((r) => {
    const date = parseDateStr(r[imp.map.date]);
    let amount, type;
    if (imp.map.debit >= 0 || imp.map.credit >= 0) {
      const d = cleanNum(r[imp.map.debit]), c = cleanNum(r[imp.map.credit]);
      if (d > 0) { amount = d; type = "expense"; } else if (c > 0) { amount = c; type = "income"; } else amount = null;
    } else {
      amount = cleanNum(r[imp.map.amount]);
      if (amount === null) { skipped++; return; }
      type = imp.map.sign >= 0 ? (amount < 0 ? "expense" : "income") : "expense";
      amount = Math.abs(amount);
    }
    if (!date || !amount || amount <= 0) { skipped++; return; }
    const payee = String(r[imp.map.payee] || "Unknown").trim() || "Unknown";
    if (others.some((t) => t.source === "statement" && t.date === date && t.amount === amount && t.payee === payee)) { skipped++; return; }
    const pl = payee.toLowerCase();
    const guess = imp.map.category >= 0 && catById()[r[imp.map.category]] ? r[imp.map.category]
      : /(swiggy|zomato|restaurant|hotel|cafe|coffee|domino|pizza|kfc|starbucks|tea)/.test(pl) ? "food"
      : /(bigbasket|dmart|grocer|blinkit|zepto|instamart|store|mart|super)/.test(pl) ? "groceries"
      : /(uber|ola|petrol|fuel|indianoil|metro|irctc|indigo|air)/.test(pl) ? "transport"
      : /(electric|bill|recharge|airtel|jio|vodafone|bescom|gas|water)/.test(pl) ? "bills"
      : /(amazon|flipkart|myntra|ajio|shop)/.test(pl) ? "shopping"
      : /(netflix|prime|spotify|hotstar|bookmyshow|movie|pvr)/.test(pl) ? "subs"
      : /(pharm|hospital|clinic|doctor|med)/.test(pl) ? "health" : "other";
    const match = others.find((t) => !t.matchedWith && !t.deletedAt && t.amount === amount && t.type === type && t.date === date);
    created.push({ id: uid(), date, amount, type, payee, note: "", source: "statement", matchedWith: match ? match.id : null, guessed: true, ...catSnap(guess), ...accSnap(accs[0] ? accs[0].id : "gpay") });
  });
  if (created.length) {
    created.forEach((c2) => { if (c2.matchedWith) { const i = txns.findIndex((x) => x.id === c2.matchedWith); if (i >= 0) txns[i] = { ...txns[i], matchedWith: c2.id }; } });
    txns = txns.concat(created);
  }
  const matched = created.filter((c2) => c2.matchedWith).length;
  imp.step = "done";
  imp.msg = `Imported ${created.length} entries from "${imp.name}"${skipped ? `, ${skipped} skipped (invalid or duplicate)` : ""}. ${matched} auto-matched. ${created.length - matched} need review below.`;
  if (created.length) month = monthStr(created.map((c2) => c2.date).sort().reverse()[0]);
  save(); render();
}
function matchPair(stId, manId) {
  txns = txns.map((t) => (t.id === stId ? { ...t, matchedWith: manId } : t.id === manId ? { ...t, matchedWith: stId } : t));
  save(); render();
}

/* ---------- encrypted cloud sync (private GitHub Gist relay) ---------- */
let sync = null, pushTimer = null, syncBusy = false;
function loadSync() { try { sync = JSON.parse(localStorage.getItem("ftySync") || "null"); } catch (e) { sync = null; } }
function saveSync() { try { localStorage.setItem("ftySync", JSON.stringify(sync)); } catch (e) {} }
loadSync();
const b64e = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function syncKey() { return crypto.subtle.importKey("raw", b64d(sync.keyB64), "AES-GCM", true, ["encrypt", "decrypt"]); }
async function packState() {
  const key = await syncKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify({ txns, cats, accs })));
  return JSON.stringify({ iv: b64e(iv), data: b64e(ct), updatedAt: new Date().toISOString() });
}
async function unpackState(content) {
  const d = JSON.parse(content);
  const key = await syncKey();
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(d.iv) }, key, b64d(d.data));
  return { data: JSON.parse(new TextDecoder().decode(pt)), updatedAt: d.updatedAt };
}
function ghHeaders(token) { return { Authorization: "token " + token, Accept: "application/vnd.github+json" }; }
function scheduleSync() { if (!sync || syncBusy) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => pushSync(true), 2500); }
async function pushSync(silent) {
  if (!sync || !sync.gistId) return;
  try {
    const content = await packState();
    const r = await fetch("https://api.github.com/gists/" + sync.gistId, { method: "PATCH", headers: ghHeaders(sync.token), body: JSON.stringify({ files: { "finance-data.json": { content } } }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    sync.lastSyncAt = new Date().toISOString(); sync.lastError = null; saveSync();
    if (view === "settings" && !locked) renderOverlays(), render();
  } catch (e) {
    sync.lastError = String(e.message || e); saveSync();
    if (!silent && !locked) alert("Sync push failed: " + sync.lastError + " (check internet or token)");
  }
}
async function pullSync(silent) {
  if (!sync || !sync.gistId) return;
  try {
    syncBusy = true;
    const r = await fetch("https://api.github.com/gists/" + sync.gistId, { headers: ghHeaders(sync.token) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const g = await r.json();
    const f = g.files && g.files["finance-data.json"];
    if (!f || !f.content) { syncBusy = false; if (!silent) alert("Cloud copy is empty — push first."); return; }
    const { data, updatedAt } = await unpackState(f.content);
    if (updatedAt > (sync.lastSyncAt || "")) {
      txns = data.txns || []; cats = data.cats || cats; accs = data.accs || accs;
      try { localStorage.setItem("fty", JSON.stringify({ txns, cats, accs, pinHash })); } catch (e) {}
      sync.lastSyncAt = updatedAt; sync.lastError = null; saveSync(); render();
      if (!silent) alert("Pulled latest data (" + txns.length + " entries).");
    } else { if (!silent) alert("Already up to date."); }
    syncBusy = false;
  } catch (e) {
    syncBusy = false;
    if (!silent) alert("Sync pull failed: " + (e.message || e));
  }
}
async function createSync() {
  const token = ($("ghToken") ? $("ghToken").value : "").trim();
  if (!token) { alert("First create and paste a GitHub personal access token (settings instructions above)."); return; }
  const old = sync; sync = { token, gistId: null, keyB64: null, lastSyncAt: "" };
  try {
    sync.keyB64 = b64e(crypto.getRandomValues(new Uint8Array(32)));
    const content = await packState();
    const r = await fetch("https://api.github.com/gists", { method: "POST", headers: ghHeaders(token), body: JSON.stringify({ description: "Finance Tracker (encrypted sync)", public: false, files: { "finance-data.json": { content } } }) });
    const g = await r.json();
    if (!g.id) throw new Error(g.message || "create failed");
    sync.gistId = g.id; sync.lastSyncAt = new Date().toISOString(); saveSync(); render();
  } catch (e) { sync = old; saveSync(); alert("Could not create sync: " + (e.message || e)); }
}
async function linkSync() {
  const token = ($("ghToken") ? $("ghToken").value : "").trim();
  let code;
  try { code = JSON.parse(($("syncCode") ? $("syncCode").value : "").trim()); } catch (e) { alert("Paste the Sync Code exactly as shown on the other device."); return; }
  if (!token || !code.gistId || !code.keyB64) { alert("Both a token and the Sync Code are needed."); return; }
  const old = sync; sync = { token, gistId: code.gistId, keyB64: code.keyB64, lastSyncAt: "" };
  saveSync(); await pullSync(false);
  if (!sync || sync.lastError) { sync = old; saveSync(); render(); }
  else render();
}
function showSyncCode() {
  const code = JSON.stringify({ gistId: sync.gistId, keyB64: sync.keyB64 });
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => alert("Sync Code copied to clipboard.\n\nIt looks like this:\n" + code), () => alert(code));
  else alert(code);
}
function unlinkSync() {
  if (confirm("Unlink this device from cloud sync?\n\nData already on this device stays. The private Gist also stays (other linked devices keep syncing).")) { sync = null; saveSync(); render(); }
}

    <div class="card" style="margin-bottom:14px;">
      <h4>📥 Import a statement (CSV or PDF)</h4>
      <p class="muted" style="margin:0 0 10px">CSV files import directly. For PDFs: try the file first — if it's compressed (most bank PDFs), open the PDF, select the transaction table, copy, and paste below.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        <button class="btn primary" onclick="importPick()">📄 Choose CSV / PDF file</button>
        <button class="btn ghost" onclick="startMap(DEMO_STATEMENT(),'demo-statement.csv')">🧪 Load demo statement</button>
      </div>
      <textarea id="pasteBox" rows="4" style="margin-top:10px;font-size:12px;font-family:monospace" placeholder="…or paste CSV rows / copied PDF table here:&#10;Date,Particulars,Withdrawal,Deposit&#10;21/11/2026,SWIGGY,640.00,"></textarea>
      <div style="height:8px"></div>
      <button class="btn" onclick="importPaste()">Import pasted rows</button>
    </div>
    ${imp.step === "map" ? `
    <div class="card" style="margin-bottom:14px;">
      <h4>Map columns · ${esc(imp.name)}</h4>
      <label class="row muted" style="margin-bottom:10px;"><input type="checkbox" class="small" style="width:auto" ${imp.hasHeader ? "checked" : ""} onchange="imp.hasHeader=this.checked;guessMap()"> First row is a header</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        ${sel("date", "Date")}${sel("payee", "Payee / merchant")}
        ${sel("amount", "Amount (single column)")}${sel("sign", "…or signed (neg = spend)")}
        ${sel("debit", "…or Debit column")}${sel("credit", "…or Credit column")}
        ${sel("category", "Category (optional)")}
      </div>
      <div class="muted" style="margin:10px 0 4px;">Preview</div>
      <div class="muted" style="font-family:monospace;background:#020617;border:1px solid #1e293b;border-radius:8px;padding:8px;overflow-x:auto;white-space:nowrap;">
        ${imp.rows.slice(0, 4).map((r) => esc(r.join(" · "))).join("<br>")}
      </div>
      <div style="height:10px"></div>
      <button class="btn primary" style="width:100%" ${canImport ? "" : "disabled"} onclick="doImport()">Import entries</button>
    </div>` : ""}
    ${imp.msg ? `<div class="card" style="margin-bottom:14px;border-color:#065f46;color:#6ee7b7;font-size:12px;">${esc(imp.msg)}</div>` : ""}
    <div class="card">
      <h4>🔍 Reconciliation queue</h4>
      <p class="muted" style="margin:0 0 10px">Statement entries waiting to be matched with a manual entry. Matched statement entries don't count twice in your totals.</p>
      ${pending.length ? pending.map((st) => {
        const sugg = txns.find((x) => !x.deletedAt && x.source !== "statement" && !x.matchedWith && x.amount === st.amount && x.type === st.type && Math.abs(new Date(x.date) - new Date(st.date)) <= 3 * 86400000);
        return `<div class="card" style="margin-bottom:10px;padding:12px;">
          <div class="row"><div style="flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(st.payee)}</div>
          <span style="font-weight:700;font-size:13px;${st.type === "income" ? "color:#34d399" : "color:#fb7185"}">${st.type === "income" ? "+" : "-"}${fmt(st.amount)}</span>
          <small>${st.date}</small></div>
          <div style="height:8px"></div>
          ${sugg ? `<div class="row" style="background:rgba(67,56,202,.3);border:1px solid rgba(99,102,241,.5);border-radius:10px;padding:8px;font-size:11px;">
            <span style="flex:1">Like your entry: ${esc(sugg.payee || sugg.catName)}, ${sugg.date}, ${fmt(sugg.amount)} <span class="muted">(${esc(sugg.catName)})</span></span>
            <button class="btn primary" style="padding:6px 12px;font-size:11px" onclick="matchPair('${st.id}','${sugg.id}')">✓ Match</button></div>`
            : `<div class="warn" style="font-size:11px;">No matching manual entry found. Add the entry manually, then it will appear here to match.</div>`}
          <div style="height:8px"></div>
          <button class="btn ghost" style="font-size:11px;color:#fb7185" onclick="if(confirm('Remove this statement entry? (It was never in your totals unless matched.)')){txns=txns.filter(x=>x.id!=='${st.id}');save();render();}">Remove this statement entry</button>
        </div>`;
      }).join("") : '<p class="muted" style="text-align:center;padding:10px;">All statement entries are matched. 🎉</p>'}
    </div>`;
}

function renderSettings() {
  $("content").innerHTML = `
    <div class="card" style="margin-bottom:14px;">
      <h4>🔐 Security</h4>
      <p class="muted">${pinHash ? "App lock is on, backed by this device's browser storage. Tap 🔒 (top right) to lock." : "No PIN set yet. Tap 🔑 (top right) to set one."}</p>
      ${pinHash ? '<button class="btn ghost" onclick="if(confirm(\'Remove PIN? Anyone opening this app on this device will see your data.\')){pinHash=null;save();render();}">Remove PIN</button>' : ""}
      <p class="muted" style="margin-top:8px">Encryption at rest of the whole database is the next security upgrade — after your test month.</p>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div class="row" style="justify-content:space-between;"><h4>📊 Categories (${cats.length})</h4><button class="btn primary" style="font-size:11px;padding:6px 12px" onclick="openCatEditor('cat','add')">+ New</button></div>
      ${cats.map((c) => { const n = usageCount("cat", c.id); return `<div class="row" style="padding:6px 0;border-bottom:1px solid rgba(30,41,59,.6);">
        <span style="width:28px;height:28px;border-radius:50%;background:${c.color}22;display:inline-flex;align-items:center;justify-content:center;">${c.icon}</span>
        <span style="flex:1;font-size:13px;">${esc(c.name)}${c.income ? ' <small class="ok">income</small>' : ""}</span>
        <small class="muted">${n}</small>
        <button class="btn ghost" style="padding:4px 9px;font-size:11px;color:#818cf8" onclick="openCatEditor('cat','edit','${c.id}')">Edit</button>
        <button class="btn ghost" style="padding:4px 9px;font-size:11px;color:#fb7185" onclick="askDeleteCA('cat','${c.id}')">Delete</button>
      </div>`; }).join("")}
      <p class="muted" style="margin-top:8px">Editing updates past entries after your confirmation. Deleting never touches past entries.</p>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div class="row" style="justify-content:space-between;"><h4>💳 Accounts (${accs.length})</h4><button class="btn primary" style="font-size:11px;padding:6px 12px" onclick="openCatEditor('acc','add')">+ New</button></div>
      ${accs.map((a) => { const n = usageCount("acc", a.id); return `<div class="row" style="padding:6px 0;border-bottom:1px solid rgba(30,41,59,.6);">
        <span style="flex:1;font-size:13px;">${esc(a.name)}</span><small class="muted">${n}</small>
        <button class="btn ghost" style="padding:4px 9px;font-size:11px;color:#818cf8" onclick="openCatEditor('acc','edit','${a.id}')">Edit</button>
        <button class="btn ghost" style="padding:4px 9px;font-size:11px;color:#fb7185" onclick="askDeleteCA('acc','${a.id}')">Delete</button>
      </div>`; }).join("")}
    </div>
    <div class="card" style="margin-bottom:14px;">
      <h4>☁️ Cloud sync (phone ↔ web)</h4>
      <p class="muted">Syncs through a <b>private GitHub Gist</b>. The app uploads only an <b>encrypted copy</b> of your data; the decryption key lives on your devices, never on GitHub. Saving a change pushes automatically; opening the app pulls newer data.</p>
      ${sync && sync.gistId ? `
        <p class="muted">Linked to gist <code>${esc(sync.gistId.slice(0, 8))}…</code>${sync.lastSyncAt ? " · Last sync: " + new Date(sync.lastSyncAt).toLocaleString("en-IN") : ""}${sync.lastError ? ` <span class="bad">· Error: ${esc(sync.lastError)}</span>` : ' <span class="ok">· ✓</span>'}</p>
        <div class="row" style="flex-wrap:wrap;gap:8px;">
          <button class="btn primary" onclick="pushSync(false)">⬆️ Push now</button>
          <button class="btn primary" onclick="pullSync(false)">⬇️ Pull now</button>
          <button class="btn ghost" onclick="showSyncCode()">🔗 Show Sync Code</button>
          <button class="btn ghost" style="color:#fb7185" onclick="unlinkSync()">Unlink</button>
        </div>`
      : `
        <div class="muted" style="margin-bottom:8px;"><b>One-time setup on this device:</b> create a GitHub token at github.com → Settings → Developer settings → Personal access tokens → <i>Generate new token (classic)</i> → tick only the <b>gist</b> scope → copy the token here.</div>
        <input id="ghToken" placeholder="ghp_… your token (stored only on this device)" style="font-size:12px;margin-bottom:8px;" />
        <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px;">
          <button class="btn primary" onclick="createSync()">① Start new cloud sync</button>
        </div>
        <div class="muted" style="margin-bottom:6px;"><b>Second device (e.g. web):</b> paste a token above <i>and</i> the Sync Code from the first device, then:</div>
        <textarea id="syncCode" rows="2" style="font-size:11px;font-family:monospace" placeholder='{"gistId":"…","keyB64":"…"}'></textarea>
        <div style="height:8px"></div>
        <button class="btn" onclick="linkSync()">② Link this device</button>
      `}
    </div>
    <div class="card">
      <h4>Backup &amp; data</h4>
      <p class="muted">Your data lives only in this browser on this device. Take a backup regularly — especially before clearing browser data.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        <button class="btn primary" onclick="backupData()">⬇️ Download backup (JSON)</button>
        <button class="btn ghost" onclick="restorePick()">⬆️ Restore backup</button>
        <button class="btn ghost" onclick="if(confirm('Replace current data with sample data? Your current entries will be lost (unless backed up).')){cats=DEFAULT_CATEGORIES.slice();accs=DEFAULT_ACCOUNTS.slice();txns=makeSeed(cats,accs);save();render();}">Load sample data (demo)</button>
      </div>
    </div>`;
}

function renderLocked() {
  $("content").innerHTML = `<div style="max-width:280px;margin:15vh auto;text-align:center;">
    <div style="font-size:48px;">🔐</div>
    <h3>Enter PIN to unlock</h3>
    <input id="pinEntry" type="password" inputmode="numeric" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:.5em" onkeydown="if(event.key==='Enter')unlock()" />
    <div id="pinErr" class="bad" style="font-size:12px;min-height:18px;margin-top:6px;"></div>
    <button class="btn primary" style="width:100%;margin-top:6px" onclick="unlock()">Unlock</button>
  </div>`;
  renderOverlays();
  setTimeout(() => { const p = $("pinEntry"); if (p) p.focus(); }, 50);
}

function syncForm() {
  if ($("fAmount")) form.amount = $("fAmount").value;
  if ($("fPayee")) form.payee = $("fPayee").value;
  if ($("fNote")) form.note = $("fNote").value;
  if ($("fDate")) form.date = $("fDate").value;
  if ($("fAccount")) form.account = $("fAccount").value;
}
function renderAddSheet() {
  const list = cats.filter((c) => !!c.income === (form.type === "income"));
  openPanel(`
    <div class="row" style="justify-content:space-between;"><h3 style="margin:0">${editingId ? "Edit transaction" : "Add transaction"}</h3><button class="btn ghost" style="padding:4px 10px" onclick="closePanel()">×</button></div>
    <div class="row" style="gap:8px;margin:12px 0;">
      <button class="btn" style="flex:1;${form.type === "expense" ? "background:#e11d48" : ""}" onclick="syncForm();form.type='expense';form.category=form.category&&catById()[form.category]&&!catById()[form.category].income?form.category:'food';renderAddSheet()">⬆ Expense</button>
      <button class="btn" style="flex:1;${form.type === "income" ? "background:#059669" : ""}" onclick="syncForm();form.type='income';form.category=form.category&&catById()[form.category]&&catById()[form.category].income?form.category:'salary';renderAddSheet()">⬇ Income</button>
    </div>
    <div class="row" style="gap:8px;">
      <span style="font-size:26px;color:#64748b;">₹</span>
      <input id="fAmount" type="number" inputmode="decimal" placeholder="0" value="${esc(form.amount)}" style="font-size:24px;font-weight:800;" />
    </div>
    <div style="height:10px"></div>
    <input id="fPayee" placeholder="Merchant / payee (e.g. Swiggy, salary)" value="${esc(form.payee)}" />
    <div style="height:10px"></div>
    <div class="muted" style="margin-bottom:6px;">Category</div>
    <div class="row" style="flex-wrap:wrap;gap:8px;">${list.map((c) => `<button class="chip" style="${form.category === c.id ? `background:${c.color};border-color:transparent;color:#fff` : ""}" onclick="syncForm();form.category='${c.id}';renderAddSheet()">${c.icon} ${esc(c.name)}</button>`).join("")}</div>
    <div style="height:12px"></div>
    <div class="row" style="gap:10px;">
      <div style="flex:1"><div class="muted" style="margin-bottom:5px;">Account</div><select id="fAccount">${accs.map((a) => `<option value="${a.id}" ${form.account === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
      <div style="flex:1"><div class="muted" style="margin-bottom:5px;">Date</div><input id="fDate" type="date" value="${form.date}" /></div>
    </div>
    <div style="height:10px"></div>
    <input id="fNote" placeholder="Note (optional)" value="${esc(form.note)}" />
    <div id="fErr" class="bad" style="font-size:12px;min-height:16px;"></div>
    <button class="btn primary" style="width:100%;margin-top:6px" onclick="saveTxn()">${editingId ? "Update transaction" : "Save transaction"}</button>
  `);
}

function renderOverlays() {
  let h = "";
  // context menu
  if (menu) {
    const t = txns.find((z) => z.id === menu.id);
    if (t) h += `<div style="position:fixed;inset:0;z-index:30" onclick="if(Date.now()>${menuGuard + 500})closeMenu()" oncontextmenu="event.preventDefault()">
      <div style="position:absolute;left:${menu.x}px;top:${menu.y}px;width:150px;background:#1e293b;border:1px solid #475569;border-radius:12px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.6);font-size:14px;">
        <div style="padding:8px 12px;font-size:10px;color:#94a3b8;border-bottom:1px solid #334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.payee || t.catName)} · ${fmt(t.amount)}</div>
        <div style="padding:10px 12px;cursor:pointer" onclick="closeMenu();openAdd('${t.id}')">✏️ Edit</div>
        <div style="padding:10px 12px;cursor:pointer" onclick="closeMenu();startSelect('${t.id}')">☑ Select</div>
        <div style="padding:10px 12px;cursor:pointer;color:#fb7185" onclick="askDelete('${t.id}')">🗑️ Delete</div>
      </div></div>`;
  }
  // trash sheet
  if (showTrashFlag) {
    const tr = trash();
    h += `<div class="overlay bottom" onclick="showTrashFlag=false;renderOverlays()"><div class="panel bottom" onclick="event.stopPropagation()">
      <div class="row" style="justify-content:space-between;"><h3 style="margin:0">🗑️ Trash</h3><button class="btn ghost" onclick="showTrashFlag=false;renderOverlays()">×</button></div>
      <p class="muted">Deleted entries wait here 7 days, then are erased for good.</p>
      ${tr.length ? tr.map((t) => txnRow(t, true)).join("") : '<p class="muted" style="text-align:center;padding:20px;">Trash is empty.</p>'}
    </div></div>`;
  }
  // delete confirm
  if (pendingDelete) {
    const t = pendingDelete;
    h += `<div class="overlay" style="z-index:40"><div class="panel">
      <h3 style="margin-top:0">🗑️ Delete this entry?</h3>
      <p style="font-size:13px;color:#cbd5e1;">"${esc(t.payee || t.catName)}" (${fmt(t.amount)}, ${t.date}) will be moved to Trash. It disappears from your totals immediately, and is kept for <b>7 days</b> — restore it anytime from the Trash in the Entries tab. After 7 days it is erased permanently.</p>
      <div class="row"><button class="btn" style="flex:1" onclick="pendingDelete=null;renderOverlays()">Cancel</button>
      <button class="btn danger" style="flex:1" onclick="moveToTrash()">Move to Trash</button></div>
    </div></div>`;
  }
  // cat/account editor
  if (editorBox) {
    const eb = editorBox;
    h += `<div class="overlay" style="z-index:35"><div class="panel">
      <h3 style="margin-top:0">${eb.mode === "add" ? "New " : "Edit "}${eb.kind === "cat" ? "category" : "account"}</h3>
      ${eb.mode === "edit" ? '<p class="warn" style="font-size:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:8px;">Editing will ask you to confirm before it touches past entries.</p>' : ""}
      <div class="muted" style="margin-bottom:5px;">Name</div>
      <input id="edName" value="${esc(eb.draft.name)}" oninput="editorBox.draft.name=this.value" />
      ${eb.kind === "cat" ? `
      <div class="muted" style="margin:10px 0 6px;">Icon</div>
      <div class="row" style="flex-wrap:wrap;gap:6px;">${ICONS.map((ic) => `<button class="chip" style="${eb.draft.icon === ic ? "background:#4f46e5;" : ""}" onclick="editorBox.draft.icon='${ic}';renderOverlays()">${ic}</button>`).join("")}</div>
      <div class="muted" style="margin:10px 0 6px;">Colour</div>
      <div class="row" style="flex-wrap:wrap;gap:8px;">${PALETTE.map((p) => `<span onclick="editorBox.draft.color='${p}';renderOverlays()" style="width:26px;height:26px;border-radius:50%;background:${p};cursor:pointer;border:3px solid ${eb.draft.color === p ? "#fff" : "transparent"}"></span>`).join("")}</div>` : ""}
      <div style="height:14px"></div>
      <div class="row"><button class="btn" style="flex:1" onclick="editorBox=null;renderOverlays()">Cancel</button>
      <button class="btn primary" style="flex:1" onclick="stepCatEditor()">${eb.mode === "add" ? "Create" : "Continue"}</button></div>
    </div></div>`;
  }
  // generic confirm
  if (confirmBox) {
    const cb = confirmBox;
    h += `<div class="overlay" style="z-index:40"><div class="panel">
      <h3 style="margin-top:0">⚠️ ${esc(cb.title)}</h3>
      <p style="font-size:13.5px;color:#cbd5e1;line-height:1.55;">${esc(cb.body)}</p>
      <div class="row"><button class="btn" style="flex:1" onclick="confirmBox=null;renderOverlays()">Cancel</button>
      <button class="btn ${cb.danger ? "danger" : "primary"}" style="flex:1;font-size:12px" onclick="runConfirm()">OK</button></div>
    </div></div>`;
  }
  // generic side panel (add/edit sheet, set PIN)
  if (panelBox) {
    h += `<div class="overlay" style="z-index:35" onclick="if(event.target===this)closePanel()"><div class="panel" onclick="event.stopPropagation()">${panelBox}</div></div>`;
  }
  $("overlays").innerHTML = h;
}
function runConfirm() { const a = confirmBox && confirmBox.action; confirmBox = null; renderOverlays(); if (a) a(); }

render();
if (sync && sync.gistId && !locked) setTimeout(() => pullSync(true), 1000);
</script>
</body>
</html>
